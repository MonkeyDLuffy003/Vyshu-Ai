name: Vyshu AI V4 Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable
          cache: true

      - name: Build fresh Flutter project
        run: |
          flutter create --org com.tejaapps --project-name vyshu_ai /tmp/vyshu_fresh
          cp -r lib /tmp/vyshu_fresh/
          cp pubspec.yaml /tmp/vyshu_fresh/
          cp -r android/app/src /tmp/vyshu_fresh/android/app/
          cp android/app/build.gradle /tmp/vyshu_fresh/android/app/
          mkdir -p /tmp/vyshu_fresh/assets/rooms
          mkdir -p /tmp/vyshu_fresh/assets/fonts
          mkdir -p /tmp/vyshu_fresh/assets/vyshu/office
          mkdir -p /tmp/vyshu_fresh/assets/vyshu/home
          mkdir -p /tmp/vyshu_fresh/assets/vyshu/adaptive
          touch /tmp/vyshu_fresh/assets/rooms/.keep
          touch /tmp/vyshu_fresh/assets/fonts/.keep
          touch /tmp/vyshu_fresh/assets/vyshu/office/.keep
          touch /tmp/vyshu_fresh/assets/vyshu/home/.keep
          touch /tmp/vyshu_fresh/assets/vyshu/adaptive/.keep

      - name: Flutter pub get
        working-directory: /tmp/vyshu_fresh
        run: flutter pub get

      - name: Build APK
        working-directory: /tmp/vyshu_fresh
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vyshu-ai-v4-apk
          path: /tmp/vyshu_fresh/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - name: Done
        run: |
          echo "================================"
          echo "  VYSHU AI V4 APK BUILD DONE"
          echo "================================"
          ls -lh /tmp/vyshu_fresh/build/app/outputs/flutter-apk/*.apk
