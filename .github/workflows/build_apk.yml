name: Build Vyshu AI Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Audio Drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev flac
          
      - name: Install Flet and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet
          pip install -r requirements.txt

      - name: Build Android APK
        run: |
          yes | flet build apk --project "Vyshu AI" --org "com.tejaswaroop.vyshu" 

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vyshu-AI-V1-Release
          path: build/apk/*.apk
          
