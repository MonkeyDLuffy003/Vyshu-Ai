name: Vyshu AI V4 Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable
          cache: true
      - name: Setup project
        run: |
          flutter create --org com.tejaapps --project-name vyshu_ai /tmp/vf
          rm -rf /tmp/vf/lib
          cp -r lib /tmp/vf/
          cp pubspec.yaml /tmp/vf/
          cp android/app/src/main/AndroidManifest.xml /tmp/vf/android/app/src/main/
          cp android/app/src/main/res/values/styles.xml /tmp/vf/android/app/src/main/res/values/
          mkdir -p /tmp/vf/android/app/src/main/kotlin/com/tejaapps/vyshuai
          cp android/app/src/main/kotlin/com/tejaapps/vyshuai/MainActivity.kt /tmp/vf/android/app/src/main/kotlin/com/tejaapps/vyshuai/
          echo "=== BEFORE FIX ===" && grep -n "minSdk" /tmp/vf/android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' /tmp/vf/android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' /tmp/vf/android/app/build.gradle
          sed -i 's/minSdk flutter.minSdkVersion/minSdk 23/' /tmp/vf/android/app/build.gradle
          echo "=== AFTER FIX ===" && grep -n "minSdk" /tmp/vf/android/app/build.gradle
          mkdir -p /tmp/vf/assets/rooms
          mkdir -p /tmp/vf/assets/vyshu/office
          mkdir -p /tmp/vf/assets/vyshu/home
          mkdir -p /tmp/vf/assets/vyshu/adaptive
          find /tmp/vf/assets -type d -exec touch {}/.keep \;
      - name: pub get
        working-directory: /tmp/vf
        run: flutter pub get
      - name: build apk
        working-directory: /tmp/vf
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: vyshu-ai-v4-apk
          path: /tmp/vf/build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30
