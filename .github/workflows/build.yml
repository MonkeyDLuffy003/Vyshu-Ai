name: Build Vyshu AI Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Restore Missing Android Files
        run: |
          flutter create --org com.tejaswaroop --project-name vyshu temp_project
          rsync -a --ignore-existing temp_project/android/ android/
          chmod +x android/gradlew
          rm -rf temp_project

      - name: Fix compileSdk Version
        run: |
          # Patch app-level compileSdk
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/' android/app/build.gradle 2>/dev/null || true

          # Force ALL plugin modules (e.g. android_intent_plus) to compileSdk 35 too
          if [ -f android/build.gradle.kts ]; then
            cat >> android/build.gradle.kts << 'EOF'

subprojects {
    afterEvaluate {
        extensions.findByType<com.android.build.gradle.BaseExtension>()?.compileSdkVersion(35)
    }
}
EOF
          elif [ -f android/build.gradle ]; then
            cat >> android/build.gradle << 'EOF'

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android.compileSdkVersion 35
        }
    }
}
EOF
          fi

      - name: Show Generated Gradle File
        run: |
          echo "---- app/build.gradle.kts ----"
          cat android/app/build.gradle.kts 2>/dev/null || echo "not found"
          echo "---- app/build.gradle ----"
          cat android/app/build.gradle 2>/dev/null || echo "not found"

      - name: Show Root Gradle File
        run: |
          echo "---- android/build.gradle.kts ----"
          cat android/build.gradle.kts 2>/dev/null || echo "not found"
          echo "---- android/build.gradle ----"
          cat android/build.gradle 2>/dev/null || echo "not found"

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi --dart-define=DEFAULT_GEMINI_KEY=${{ secrets.DEFAULT_GEMINI_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vyshu-AI-V1-Flutter
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
