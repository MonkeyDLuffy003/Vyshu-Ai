name: Build Vyshu AI Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: 'stable'

      - name: Restore Missing Android Files
        run: |
          flutter create --org com.tejaswaroop --project-name vyshu temp_project
          rsync -a --ignore-existing temp_project/android/ android/
          chmod +x android/gradlew
          rm -rf temp_project

      - name: Verify our committed build.gradle.kts is in place
        run: |
          echo "===== android/app/build.gradle.kts (should show compileSdk = 36) ====="
          cat android/app/build.gradle.kts

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi --dart-define=DEFAULT_GEMINI_KEY=${{ secrets.DEFAULT_GEMINI_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vyshu-AI-V1-Flutter
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
