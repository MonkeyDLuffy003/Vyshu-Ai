name: Build Vyshu AI Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Restore Missing Gradle Build Files
        run: |
          flutter create --org com.tejaswaroop --project-name vyshu temp_project
          cp -n temp_project/android/build.gradle android/build.gradle 2>/dev/null || true
          cp -n temp_project/android/build.gradle.kts android/build.gradle.kts 2>/dev/null || true
          cp -n temp_project/android/settings.gradle android/settings.gradle 2>/dev/null || true
          cp -n temp_project/android/settings.gradle.kts android/settings.gradle.kts 2>/dev/null || true
          cp -n temp_project/android/gradle.properties android/gradle.properties 2>/dev/null || true
          cp -n temp_project/android/gradlew android/gradlew 2>/dev/null || true
          cp -n temp_project/android/gradlew.bat android/gradlew.bat 2>/dev/null || true
          cp -rn temp_project/android/gradle android/gradle 2>/dev/null || true
          cp -n temp_project/android/app/build.gradle android/app/build.gradle 2>/dev/null || true
          cp -n temp_project/android/app/build.gradle.kts android/app/build.gradle.kts 2>/dev/null || true
          chmod +x android/gradlew
          rm -rf temp_project

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi --dart-define=DEFAULT_GEMINI_KEY=${{ secrets.DEFAULT_GEMINI_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vyshu-AI-V1-Flutter
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
