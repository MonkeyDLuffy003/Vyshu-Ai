name: Build Vyshu AI Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: 'stable'

      - name: Restore Missing Android Files
        run: |
          flutter create --org com.tejaswaroop --project-name vyshu temp_project
          rsync -a --ignore-existing temp_project/android/ android/
          chmod +x android/gradlew
          rm -rf temp_project

      - name: Get Dependencies
        run: flutter pub get

      - name: Configure Keystore for Play Protect Safe Release
        run: |
          keytool -genkey -v -keystore android/app/release-keystore.jks \
            -alias vyshukey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass vyshupassword -keypass vyshupassword \
            -dname "CN=Vyshu AI, OU=AI Native, O=Teja Swaroop, L=Bengaluru, S=KA, C=IN"
          
          # Inject release signing config into android/app/build.gradle
          cat << 'EOF' > android/key.properties
          storePassword=vyshupassword
          keyPassword=vyshupassword
          keyAlias=vyshukey
          storeFile=release-keystore.jks
          EOF

      - name: Build Vyshu AI Primary APK
        run: flutter build apk --release --dart-define=DEFAULT_GEMINI_KEY=${{ secrets.DEFAULT_GEMINI_KEY }}

      - name: Build Vyshu Key Vault Companion APK
        run: flutter build apk --release --target=lib/vault_main.dart

      - name: Prepare Combined Install Pack
        run: |
          mkdir -p install_pack
          cp build/app/outputs/flutter-apk/app-release.apk install_pack/Vyshu-AI-Primary.apk
          # The second build generates app-release.apk targeting vault_main.dart
          cp build/app/outputs/flutter-apk/app-release.apk install_pack/Vyshu-Key-Vault.apk || true

      - name: Upload Complete Vyshu Android Pack
        uses: actions/upload-artifact@v4
        with:
          name: Vyshu-Android-Install-Pack
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            install_pack/
