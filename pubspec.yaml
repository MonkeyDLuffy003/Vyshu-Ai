name: vyshu_ai
description: Vyshu AI V4 - Personal AI Secretary by Teja
publish_to: 'none'
version: 4.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Networking ───────────────────────────────────────────────
  http: ^1.2.0                    # API calls (Gemini, Groq, Together)
  connectivity_plus: ^6.0.1      # Internet check before API calls

  # ── Storage ──────────────────────────────────────────────────
  shared_preferences: ^2.2.2     # API keys + settings storage
  path_provider: ^2.1.2          # File paths (memory JSON)

  # ── UI + Fonts ───────────────────────────────────────────────
  google_fonts: ^6.2.1           # Orbitron (header) + Inter (body)
  flutter_animate: ^4.5.0        # Smooth animations
  cached_network_image: ^3.3.1   # Cache room background images

  # ── Mobile Controls ──────────────────────────────────────────
  permission_handler: ^11.3.0    # Permissions at runtime
  torch_light: ^1.0.2            # Torch / Flashlight
  volume_controller: ^2.0.7      # Volume control
  screen_brightness: ^0.2.2+1    # Brightness control
  url_launcher: ^6.2.5           # Open Spotify, YouTube, apps
  android_intent_plus: ^1.0.3    # WiFi, Hotspot, BT settings

  # ── PDF + Resume ─────────────────────────────────────────────
  pdf: ^3.10.8                   # PDF generation
  printing: ^5.12.0              # Preview + share PDF

  # ── Email (Gmail archive) ────────────────────────────────────
  mailer: ^6.1.0                 # SMTP Gmail archive

  # ── Utilities ────────────────────────────────────────────────
  intl: ^0.19.0                  # Date/time formatting
  flutter_svg: ^2.0.9            # SVG assets
  image_picker: ^1.0.7           # Pick image for profile/logo

flutter:
  uses-material-design: true

  assets:
    - assets/rooms/
    - assets/fonts/

  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700
        - asset: assets/fonts/Orbitron-Regular.ttf
          weight: 400
